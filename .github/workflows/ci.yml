name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  # Static checks only, despite the job name. The name must stay `build`: the
  # "Main protection" ruleset requires a status check with that exact context,
  # and for Actions the context is the job name — renaming it would leave the
  # required check permanently pending.
  #
  # This job deliberately does NOT run `next build`: since the CSVs were retired
  # the library pages prerender from the FastAPI origin, and there is none in
  # Actions, so the build would fail on requireLibraryApiOrigin() rather than on
  # anything about the change under review. The real production build runs on
  # every PR as the Vercel check, which does have an origin and live data, so
  # build coverage isn't lost.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm test` runs TypeScript directly under `node --test`
          # via --experimental-strip-types, which does not exist before 22.6.
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The frontend suite ran nowhere until now, which is part of how six wrong
      # fixes to the same bug shipped past a green CI.
      - name: Test
        run: npm test

  # The Python half of the toolchain (spec decision #8). Separate job so it runs
  # in parallel with `build` and its failures are attributable at a glance.
  #
  # Runs against a real Postgres rather than letting the DB-backed tests skip:
  # ~two thirds of the suite is integration tests gated on DATABASE_URL, and
  # multi-user isolation — the thing Phase 4 is actually building — is only
  # testable against a database.
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health gate the steps below can start before Postgres is
        # accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # normalize_database_url() rewrites the scheme to postgresql+psycopg,
      # so the plain postgresql:// form is what the rest of the repo uses too.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Supabase's GoTrue owns auth.users in every other environment, so Alembic
      # never creates it — but migration f985740c0df9 adds a real FK to it, and
      # CI runs bare Postgres. This installs a minimal stand-in first.
      - name: Create auth schema stand-in
        run: psql "$DATABASE_URL" -f scripts/ci_auth_schema.sql

      - name: Migrate
        run: uv run alembic upgrade head

      # test_users_api.py reads the seeded library back through the API, so the
      # DB still has to be seeded. Its expectations now come from the DB rather
      # than the CSV fixtures, but an empty library makes them vacuous.
      - name: Seed
        run: uv run python scripts/seed.py

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
