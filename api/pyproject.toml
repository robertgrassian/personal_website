[project]
name = "personal-website-api"
version = "0.1.0"
description = "FastAPI backend for the personal website (instanced game libraries)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.51",
]

# Dev-only on purpose, to keep the deployed function small: Vercel's Python
# runtime provides the ASGI server, so uvicorn would never be imported there,
# and alembic runs migrations from a GitHub Actions checkout rather than from
# the function. `uv sync` installs this group by default, so both stay available
# locally and in CI.
[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "uvicorn>=0.35",
    "ruff>=0.12",
    "pytest>=8.4",
    "httpx>=0.28",
]

[tool.uv]
# Not an installable package — a deployable app. Keeps `uv export` from
# emitting the project itself as a requirement.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `app` package importable when pytest runs from api/.
pythonpath = ["."]
