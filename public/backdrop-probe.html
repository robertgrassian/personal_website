<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Backdrop probe</title>
    <style>
      :root {
        --ground: #f2f1ed;
        --grain: #d9d5cb;
        --surface: #fbfaf8;
        --ink: #1b1a17;
        --muted: #6f6b62;
        --rule: #dbd8d0;
        --accent: #0d6b62;
        --accent-ink: #ffffff;
        --scrim: rgba(12, 12, 10, 0.45);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #131518;
          --grain: #262b31;
          --surface: #1b1e22;
          --ink: #e9e6e0;
          --muted: #97938a;
          --rule: #2e3238;
          --accent: #4bbdaf;
          --accent-ink: #10201e;
          --scrim: rgba(0, 0, 0, 0.55);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--ground);
        color: var(--ink);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      /* Everything that should get blurred lives in here. Candidate D filters
         this element, so the controls and overlays must stay outside it. */
      #content {
        padding: 1.25rem 1rem 0;
      }

      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.4rem;
      }

      p.lede {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      /* Dense, high-contrast tiles so blurred and crisp are unmistakable, all
         the way to the bottom of the page. */
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }

      .tile {
        aspect-ratio: 3 / 4;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.35) 0 4px,
          transparent 4px 8px
        );
      }

      #controls {
        position: fixed;
        top: max(0.6rem, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(23rem, calc(100vw - 1.2rem));
        z-index: 200;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.7rem;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      }

      #controls p {
        margin: 0 0 0.55rem;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.35rem;
      }

      button {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.55rem 0.2rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: var(--ground);
        color: var(--ink);
        cursor: pointer;
      }

      button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      button.wide {
        grid-column: 1 / -1;
        margin-top: 0.35rem;
      }

      /* ---- Candidates. Only one is active at a time. ---- */

      .ov {
        display: none;
        background: var(--scrim);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: 100;
      }

      .ov.on {
        display: block;
      }

      /* A: what the site shipped originally. */
      #ovA {
        position: fixed;
        inset: 0;
      }

      /* B: what is on the site right now, after #148. */
      #ovB {
        position: fixed;
        left: 0;
        right: 0;
        top: -25vh;
        bottom: -25vh;
      }

      /* C: document space rather than viewport space. Height is set in JS from
         documentElement.scrollHeight, since no CSS length is the document's. */
      #ovC {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }

      /* D: no overlay at all. The content itself is filtered, so the effect is
         wherever the content is. Applied to #content by script. */
      #content.filtered {
        filter: blur(5px) brightness(0.62);
      }

      /* E: fixed, but sized from visualViewport by script each frame. */
      #ovE {
        position: fixed;
        left: 0;
        width: 100%;
      }

      #verdict {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(0.5rem, env(safe-area-inset-bottom));
        z-index: 201;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 0.78rem;
        font-weight: 600;
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <h1>Backdrop probe</h1>
      <p class="lede">
        Scroll down so the URL bar shrinks to its pill, then tap a letter. Watch the strip just above
        the pill: blurred means that candidate covers it.
      </p>
      <div class="tiles" id="tiles"></div>
    </div>

    <div id="ovA" class="ov"></div>
    <div id="ovB" class="ov"></div>
    <div id="ovC" class="ov"></div>
    <div id="ovE" class="ov"></div>

    <div id="controls">
      <p id="hint">Nothing active. Scroll first, then pick a candidate.</p>
      <div class="row">
        <button data-k="A">A</button>
        <button data-k="B">B</button>
        <button data-k="C">C</button>
        <button data-k="D">D</button>
        <button data-k="E">E</button>
        <button data-k="off">Off</button>
      </div>
      <button class="wide" id="whichHelp">What are A to E?</button>
    </div>

    <div id="verdict">no candidate active</div>

    <script>
      // Tiles, enough of them that the page scrolls well past a phone screen
      // and there is always dense content behind the bottom strip.
      const hues = [8, 32, 55, 96, 150, 190, 215, 260, 300, 330];
      const tiles = document.getElementById("tiles");
      for (let i = 0; i < 36; i++) {
        const d = document.createElement("div");
        d.className = "tile";
        d.style.backgroundColor = `hsl(${hues[i % hues.length]} 65% 45%)`;
        d.textContent = i + 1;
        tiles.appendChild(d);
      }

      const LABELS = {
        A: "A: fixed inset-0 (the original)",
        B: "B: fixed, bled 25vh (live now)",
        C: "C: absolute, document height",
        D: "D: filter on the content itself",
        E: "E: fixed, sized from visualViewport",
      };

      const content = document.getElementById("content");
      const verdict = document.getElementById("verdict");
      const hint = document.getElementById("hint");
      let active = null;
      let rafId = null;

      function sizeC() {
        document.getElementById("ovC").style.height =
          document.documentElement.scrollHeight + "px";
      }

      function trackE() {
        const vv = window.visualViewport;
        const e = document.getElementById("ovE");
        if (vv) {
          // offsetTop is how far the visual viewport has been pushed down
          // inside the layout viewport; height is what is actually on screen.
          e.style.top = vv.offsetTop + "px";
          e.style.height = vv.height + "px";
        } else {
          e.style.top = "0px";
          e.style.height = "100%";
        }
        rafId = requestAnimationFrame(trackE);
      }

      function setActive(k) {
        ["A", "B", "C", "E"].forEach((x) =>
          document.getElementById("ov" + x).classList.toggle("on", k === x)
        );
        content.classList.toggle("filtered", k === "D");
        document
          .querySelectorAll("button[data-k]")
          .forEach((b) => b.classList.toggle("on", b.dataset.k === k));

        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        if (k === "C") sizeC();
        if (k === "E") trackE();

        active = k;
        verdict.textContent = LABELS[k] || "no candidate active";
        hint.textContent =
          k && k !== "off"
            ? "Look at the strip above the URL pill. Blurred means it works."
            : "Nothing active. Scroll first, then pick a candidate.";
      }

      document.querySelectorAll("button[data-k]").forEach((b) => {
        b.addEventListener("click", () => setActive(b.dataset.k === "off" ? null : b.dataset.k));
      });

      document.getElementById("whichHelp").addEventListener("click", () => {
        alert(
          Object.values(LABELS).join("\n\n") +
            "\n\nA and B are known to fail. C, D and E are the untested ones."
        );
      });

      addEventListener("resize", () => {
        if (active === "C") sizeC();
      });
    </script>
  </body>
</html>
